<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
{{theme_head}}
<style>
{{styles}}

/* ===== 站点骨架 ===== */
body { padding: 0; }
.page-shell { max-width: 1400px; margin: 0 auto; padding: 0 1.25rem 3rem; }
.top-bar { padding: 1rem 0 0.6rem; }
.top-bar-inner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top-bar-inner .theme-toggle { margin-left: auto; }
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--k-text); }
.logo-mark { width: 34px; height: 34px; flex: 0 0 auto; border-radius: 9px; }
.site-name { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.3px; }
.site-title { font-size: 0.85rem; color: var(--k-text-muted); }
.gh-link { font-size: 0.85rem; color: var(--k-text-muted); text-decoration: none; }
.gh-link:hover { color: var(--k-text); text-decoration: underline; }
.breadcrumb { margin-top: 0.7rem; font-size: 0.85rem; color: var(--k-text-muted); word-break: break-all; }
.breadcrumb a { color: var(--k-link); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb .separator { margin: 0 6px; color: var(--k-text-fainter); }
.global-divider { width: 100%; height: 1px; background: var(--k-border-faint); }

/* ===== 正文 + 右侧目录 ===== */
.page-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 220px;
  gap: 0 28px;
  align-items: start;
  margin-top: 1.5rem;
}
.page-grid .markdown-body { max-width: 820px; width: 100%; }
.page-grid .toc-sidebar {
  grid-column: 2;
  grid-row: 1;
  position: sticky;
  top: 1rem;
  width: 220px;
  font-size: 0.88rem;
  line-height: 1.5;
}
.toc-sidebar:empty { display: none; }

.toc-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
  font-weight: 600;
  padding: 0.4rem 0;
  border-bottom: 1px solid var(--k-border-faint);
  margin-bottom: 0.5rem;
  color: var(--k-text);
}
.toc-header .arrow {
  display: inline-block;
  transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  font-size: 0.8rem;
}
.toc-collapsed .arrow { transform: rotate(180deg); }
.toc-sidebar:not(.toc-collapsed) .arrow { transform: rotate(90deg); }
.toc-body { overflow: hidden; transition: max-height 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.toc-body ul { list-style: none; padding-left: 0; }
.toc-body ul ul { padding-left: 1rem; }
.toc-body li { margin-bottom: 0.3rem; }
.toc-body a { color: var(--k-text-soft); text-decoration: none; }
.toc-body a:hover { text-decoration: underline; }

@media (max-width: 1023px) {
  .page-grid { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .page-grid .toc-sidebar { grid-column: 1; grid-row: 1; position: static; width: 100%; margin-bottom: 1.2rem; }
  .page-grid .markdown-body { grid-row: 2; }
}

/* ===== 左侧章节导航 ===== */
.nav-sidebar {
  position: fixed; left: 0; top: 0;
  height: 100vh; width: 280px;
  background: var(--k-surface);
  box-shadow: 2px 0 16px var(--k-shadow);
  z-index: 1000;
  display: flex; flex-direction: column;
  transition: transform 0.3s ease, visibility 0s 0s;
}
.nav-sidebar.init-hide { visibility: hidden; }
.nav-sidebar.collapsed {
  transform: translateX(-280px);
  visibility: hidden;
  transition: transform 0.3s ease, visibility 0s 0.3s;
}
.nav-brand { padding: 1rem 1rem 0.4rem; }
.nav-brand a { display: inline-flex; align-items: center; gap: 9px; text-decoration: none; color: var(--k-text); font-weight: 700; }
.nav-brand .logo-mark { width: 28px; height: 28px; }

.nav-inner {
  flex: 1; overflow-y: auto;
  padding: 0 1rem 0.5rem;
  font-size: 0.9rem; line-height: 1.6;
}
.nav-header { padding-bottom: 0.5rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--k-border-faint); }
.nav-header h3 { font-size: 1rem; margin: 0; color: var(--k-text); }
.nav-inner::-webkit-scrollbar { width: 4px; }
.nav-inner::-webkit-scrollbar-thumb { background: var(--k-scroll-thumb); border-radius: 2px; }
.nav-inner::-webkit-scrollbar-track { background: transparent; }

.nav-bottom-toggle {
  flex-shrink: 0;
  border-top: 1px solid var(--k-border-faint);
  background: var(--k-surface-alt);
}
.nav-bottom-toggle .nav-toggle-btn {
  width: 100%; display: block; padding: 0.75rem;
  border: none; background: transparent;
  color: var(--k-text-muted); font-size: 0.95rem;
  cursor: pointer; text-align: center;
  transition: background 0.2s;
}
.nav-bottom-toggle .nav-toggle-btn:hover { background: var(--k-bg-softer); }
.toggle-all-folders {
  position: absolute;
  bottom: calc(100% + 1px);
  left: 0;
  z-index: 20;
  background: var(--k-surface-translucent);
  backdrop-filter: blur(4px);
  border: 1px solid var(--k-border);
  border-left: none;
  border-bottom: none;
  border-radius: 0 8px 0 0;
  padding: 0.5rem 0.7rem;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  box-shadow: 2px -2px 8px var(--k-shadow);
}
.toggle-all-folders:hover { background: var(--k-surface-translucent-hover); }

.nav-show-btn {
  position: fixed; left: 0; bottom: 0; z-index: 1001;
  background: var(--k-surface); border: 1px solid var(--k-border); border-left: none;
  border-radius: 0 10px 0 0;
  padding: 0.6rem 0.9rem; cursor: pointer;
  font-size: 1.2rem; box-shadow: 2px -2px 8px var(--k-shadow);
  display: none;
}
@media (max-width: 1024px) {
  .nav-sidebar { width: 100vw; }
  .nav-sidebar.collapsed { transform: translateX(-100vw); }
  .nav-show-btn {
    left: 12px; bottom: 12px; border-radius: 12px;
    padding: 0.4rem 0.6rem; font-size: 1rem;
  }
}

/* 导航是浮层：展开/收起都不改变页面布局，正文位置保持不动。
   以前这里会给 .page-shell 加 padding-left: 300px，而 .page-shell 又是居中的，
   于是展开/收起时正文一边变窄一边重新居中，看起来就是正文左右滑动。 */

.nav-tree { list-style: none; padding-left: 0; margin: 0; }
.nav-tree ul { list-style: none; padding-left: 1.1rem; margin: 0; }
.nav-folder-name {
  position: relative;
  cursor: pointer;
  font-weight: 600;
  display: block;
  padding: 0.25em 0.5em 0.25em 2.1em;
  border-radius: 4px;
  user-select: none;
  color: var(--k-text);
}
.nav-folder-name::before {
  content: '▾';
  position: absolute;
  left: 0.5em;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.8em;
  transition: transform 0.2s;
}
.nav-folder.collapsed > .nav-folder-name::before { transform: translateY(-50%) rotate(-90deg); }
.nav-folder > .nav-tree { overflow: hidden; }
.nav-file { margin: 0; }
.nav-file a {
  display: block;
  padding: 0.25em 0.5em 0.25em 1.7em;
  color: var(--k-text-soft);
  text-decoration: none;
  border-radius: 4px;
}
.nav-file a:hover { background: var(--k-bg-softer); }
.nav-file.current > a { font-weight: 600; color: var(--k-text); background: var(--k-highlight); }

/* ===== 上一章 / 下一章 ===== */
.page-nav { display: flex; justify-content: space-between; gap: 1rem; margin-top: 3rem; }
.page-nav-link {
  flex: 1 1 0;
  display: flex; flex-direction: column; gap: 0.2rem;
  padding: 0.8rem 1rem;
  border: 1px solid var(--k-border);
  border-radius: 10px;
  background: var(--k-surface);
  color: var(--k-text);
  text-decoration: none;
  transition: background 0.15s, border-color 0.15s;
}
.page-nav-link span { font-size: 0.78rem; color: var(--k-text-muted); }
.page-nav-link strong { font-size: 0.95rem; font-weight: 600; }
.page-nav-next { text-align: right; align-items: flex-end; }
.page-nav-link:hover { background: var(--k-surface-alt); border-color: var(--k-text-fainter); }
.page-nav:empty { display: none; }

/* ===== 页脚 ===== */
.site-footer {
  margin-top: 2.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--k-border-faint);
  font-size: 0.82rem;
  line-height: 1.8;
  color: var(--k-text-muted);
}
.site-footer a { color: var(--k-text-soft); }
@media (max-width: 600px) {
  .site-title, .gh-link { display: none; }
  .page-shell { padding: 0 0.9rem 2rem; }
  .page-nav { flex-direction: column; }
  .page-nav-next { text-align: left; align-items: flex-start; }
}
</style>
</head>
<body>
<nav class="nav-sidebar init-hide" id="navSidebar" aria-label="章节导航">
  <div class="nav-brand"><a href="/">{{site_logo}}<span>{{site_name}}</span></a></div>
  <div class="nav-inner">
    {{nav_sidebar}}
  </div>
  <div class="nav-bottom-toggle">
    <button class="nav-toggle-btn" id="navToggleBtn" title="收起导航">◀ 收起导航</button>
    <button class="toggle-all-folders" id="toggleAllFolders" title="展开/收起所有章节"><span>☰</span></button>
  </div>
</nav>
<button class="nav-show-btn" id="navShowBtn" title="展开导航" aria-label="展开导航">▶</button>

<div class="page-shell">
  <header class="top-bar">
    <div class="top-bar-inner">
      <a class="brand" href="/">{{site_logo}}<span class="site-name">{{site_name}}</span></a>
      <span class="site-title">{{tagline}}</span>
      <a class="gh-link" href="{{repo}}">GitHub</a>
      {{theme_button}}
    </div>
    <div class="breadcrumb">{{breadcrumb}}</div>
  </header>
  <div class="global-divider"></div>

  <div class="page-grid">
    <div class="toc-sidebar" id="tocSidebar">{{toc}}</div>
    <main class="markdown-body">{{content}}</main>
  </div>

  {{prev_next}}
  {{footer}}
</div>

<script src="/js/theme.js" defer></script>
<script src="/js/toc.js" defer></script>
<script src="/js/nav-sidebar.js" defer></script>
<script src="/js/code-copy.js" defer></script>
</body>
</html>
